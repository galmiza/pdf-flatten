name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint, tests, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6 # also validates the Gradle wrapper
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
      # Installable APKs, downloadable from the run's summary page (release is signed with the
      # runner's debug key here; the tagged releases use the real key, see release.yml)
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/*/*.apk
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
